services:
  memora-daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    container_name: memora-daemon
    ports:
      - "${MEMORA_DAEMON_PORT:-8742}:8742"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ~/.hermes:/root/.hermes:rw
      - ~/hermes-workspace:/root/hermes-workspace:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8742/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
