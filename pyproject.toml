[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memora"
version = "0.5.1"
description = "Persistent semantic memory plugin for Hermes AI agents — Digital Twins for startup teams"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Memora Contributors", email = "hello@kubar.tech"},
]
requires-python = ">=3.10"
keywords = ["ai", "memory", "rag", "hermes", "startup", "knowledge-management", "digital-twin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/fenestbuc/memora"
Repository = "https://github.com/fenestbuc/memora"
Issues = "https://github.com/fenestbuc/memora/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "black", "ruff"]

[project.scripts]
memora-nightly = "memora.nightly_brain:main"
memora-weekly = "memora.weekly_digest:main"
memora-evals = "memora.run_evals:main"
memora-migrate = "memora.rag_migrate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
