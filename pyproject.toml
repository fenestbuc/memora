[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-rag-memory"
version = "0.1.0"
description = "Persistent semantic memory plugin for Hermes AI agents"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Hermes RAG Memory Contributors", email = "hello@kubar.tech"},
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "black", "ruff"]

[project.scripts]
hermes-rag-memory-nightly = "memora.nightly_brain:main"
hermes-rag-memory-weekly = "memora.weekly_digest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
